services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horizon
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://horizon:${POSTGRES_PASSWORD}@database:5432/horizon
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run scripts/configure.py first}
      DEMO_MODE: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Generate demo credentials first}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
